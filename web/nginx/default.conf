# nginx-unprivileged: listens on 8080 (app) and 8180 (Keycloak auth origin). Host ports are mapped by compose.
log_format json escape=json '{"time":"$time_iso8601","request_id":"$request_id","remote_addr":"$remote_addr","method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$upstream_response_time","upstream":"$upstream_addr","host":"$http_host","ua":"$http_user_agent"}';
access_log /dev/stdout json;

resolver 127.0.0.11 valid=10s ipv6=off;

# Throttle credential POSTs only (Keycloak also locks accounts out). Docker Desktop NATs every host client to one
# address, so GETs are never limited here and the rates are generous. 429 rather than the default 503.
map $request_method $login_post_key {
  default "";
  POST $binary_remote_addr;
}
limit_req_zone $login_post_key zone=login_post:1m rate=5r/s;
limit_req_zone $binary_remote_addr zone=bff:1m rate=20r/s;
limit_req_status 429;

upstream api_up {
  zone api_up 64k;
  server api:8080 resolve;
  keepalive 16;
}
upstream keycloak_up {
  zone keycloak_up 64k;
  server keycloak:8080 resolve;
}

# The app cookie is not port-scoped, so the browser also sends it to the auth origin. Strip it there, keeping the
# separators of its neighbours intact: first / middle / last position (also the `__Host-` form used over https).
map $http_cookie $kc_cookie {
  "~^(?:__Host-)?dp_session=[^;]*(?:;\s*(?<rest>.*))?$" "$rest";
  "~^(?<before>.*?);\s*(?:__Host-)?dp_session=[^;]*;\s*(?<after>.+)$" "$before; $after";
  "~^(?<before>.*?);\s*(?:__Host-)?dp_session=[^;]*$" "$before";
  default $http_cookie;
}

server {
  listen 8080;
  server_name _;
  server_tokens off;
  client_max_body_size 64k;
  # Inherited only by responses no location handles (e.g. a 400 raised before routing).
  include /etc/nginx/security-headers.conf;
  include /etc/nginx/csp-app.conf;

  location /api/ {
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/csp-app.conf;
    proxy_pass http://api_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_next_upstream error timeout http_502 http_503;
    proxy_next_upstream_tries 2;
    proxy_read_timeout 30s;
  }
  location ~ ^/(bff/|signin-oidc|signout-callback-oidc) {
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/csp-app.conf;
    limit_req zone=bff burst=40 nodelay;
    proxy_pass http://api_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
  }
  location /assets/ {
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/csp-app.conf;
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }
  location / {
    include /etc/nginx/security-headers.conf;
    include /etc/nginx/csp-app.conf;
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}

# Keycloak gets its own origin so an XSS on the app cannot reach it. Allowlist only; everything else is 404.
server {
  listen 8180;
  server_name _;
  server_tokens off;
  client_max_body_size 64k;
  include /etc/nginx/security-headers.conf;

  # Self-service profile editing would let a user change the display name the app trusts; not exposed.
  location ^~ /realms/dispute-portal/account {
    include /etc/nginx/security-headers.conf;
    return 404;
  }

  location ^~ /realms/dispute-portal/ {
    include /etc/nginx/security-headers.conf;
    # No app CSP here: Keycloak sends its own. Hide its duplicates of the headers we set.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    limit_req zone=login_post burst=20 nodelay;
    proxy_pass http://keycloak_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $kc_cookie;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Request-ID $request_id;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
  }
  location ^~ /resources/ {
    include /etc/nginx/security-headers.conf;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_pass http://keycloak_up;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $kc_cookie;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
  }
  location / {
    include /etc/nginx/security-headers.conf;
    return 404;
  }
}
