name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact -v

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: scripts/check-constraints.sh
      - run: dotnet restore DisputePortal.slnx --locked-mode
      - run: dotnet format whitespace DisputePortal.slnx --verify-no-changes
      - run: dotnet build DisputePortal.slnx -c Release --no-restore -warnaserror
      - name: unit tests
        run: dotnet test tests/DisputePortal.UnitTests -c Release --no-build --nologo
      - name: integration tests (Testcontainers)
        run: dotnet test tests/DisputePortal.IntegrationTests -c Release --no-build --nologo
      - name: vulnerable packages
        run: |
          dotnet list DisputePortal.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '^\s+>' vuln.txt; then echo "vulnerable package found" >&2; exit 1; fi

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: TS types match the committed OpenAPI snapshot
        run: |
          if [ -f ../docs/openapi.json ] && [ -f src/api/schema.d.ts ]; then
            npm run gen:types
            git diff --exit-code src/api/schema.d.ts
          fi
      - run: npm audit --audit-level=high

  images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          load: true
          tags: dispute-portal-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: dispute-portal-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Trivy (fixable CRITICAL blocks)
        run: |
          for img in dispute-portal-api:local dispute-portal-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              ghcr.io/aquasecurity/trivy:0.65.0 image --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore "$img"
          done
      - run: docker save dispute-portal-api:local dispute-portal-web:local -o images.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar
          retention-days: 1

  e2e:
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: docker load -i images.tar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: start the stack
        run: docker compose up -d --wait --no-build
      - run: npm ci --ignore-scripts
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [secrets, backend, frontend, images, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/maseko-lucky-9/dispute-portal-api:${{ github.sha }}
            ghcr.io/maseko-lucky-9/dispute-portal-api:latest
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/maseko-lucky-9/dispute-portal-web:${{ github.sha }}
            ghcr.io/maseko-lucky-9/dispute-portal-web:latest
          cache-from: type=gha,scope=web

  ci-ok:
    if: always()
    needs: [secrets, backend, frontend, images, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        run: |
          echo '${{ toJSON(needs) }}'
          if echo '${{ join(needs.*.result, ' ') }}' | grep -qE 'failure|cancelled'; then exit 1; fi
