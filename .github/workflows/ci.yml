name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      half:
        description: "Image to publish (dry run unless dry_run is false, and only from main)"
        type: choice
        options: [both, api, web]
        default: both
      dry_run:
        description: "Print what would be pushed; push nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  changes:
    # ADR-012: decides which half a change touches, so each half builds and publishes on its own. One workflow keeps
    # `ci-ok` the single required check; a skipped job passes it. Any trouble computing the diff turns everything on.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      stack: ${{ steps.paths.outputs.stack }}
      halves: ${{ steps.paths.outputs.halves }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the classifier's table test
        run: scripts/test-changed-paths.sh
      - name: the homelab image-bump script's table test (ADR-017)
        run: scripts/test-bump-homelab-image.sh
      - name: the homelab bump-PR step's test (ADR-017)
        run: scripts/test-open-homelab-bump-pr.sh
      - name: classify the change
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          HALF: ${{ inputs.half }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          files=ALL
          case "$EVENT" in
            pull_request)
              files=$(scripts/changed-files.sh "origin/${BASE_REF}...HEAD") || files=ALL ;;
            push)
              # Diff against the last commit whose `ci` run on main SUCCEEDED, not against `event.before`: a run that
              # failed, or a queued run GitHub replaced with a newer one, never published its images, and its
              # changes must not be lost to the next push. No such run, or one that is not an ancestor, means ALL.
              base=$(gh run list --workflow ci.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
              if [ -n "$base" ] && git merge-base --is-ancestor "$base" "$GITHUB_SHA" 2>/dev/null; then
                echo "last successful run on main: $base"
                files=$(scripts/changed-files.sh "$base" "$GITHUB_SHA") || files=ALL
              fi ;;
          esac
          # A prefix that is not whitespace: the runner ignores leading whitespace before a `::` workflow command.
          echo "changed paths ($EVENT):"; printf '%s\n' "$files" | sed 's/^/changed: /'
          result=$(printf '%s\n' "$files" | scripts/changed-paths.sh)
          if [ "$EVENT" = workflow_dispatch ]; then
            # A manual run builds and verifies both halves; the input only picks what to publish.
            result=$(printf 'ALL\n' | scripts/changed-paths.sh | grep -v -E '^(api|web)=')
            case "$HALF" in
              api)  result="$result"$'\n'"api=true"$'\n'"web=false" ;;
              web)  result="$result"$'\n'"api=false"$'\n'"web=true" ;;
              *)    result="$result"$'\n'"api=true"$'\n'"web=true" ;;
            esac
          fi
          echo "$result"
          api=$(printf '%s\n' "$result" | sed -n 's/^api=//p')
          web=$(printf '%s\n' "$result" | sed -n 's/^web=//p')
          halves=$(jq -nc --argjson a "$api" --argjson w "$web" '[(if $a then "api" else empty end), (if $w then "web" else empty end)]')
          { printf '%s\n' "$result" | grep -E '^(backend|frontend|stack)='; echo "halves=$halves"; } >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact -v

  backend:
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: scripts/check-constraints.sh
      - run: dotnet restore DisputePortal.slnx --locked-mode
      - run: dotnet format whitespace DisputePortal.slnx --verify-no-changes
      - run: dotnet build DisputePortal.slnx -c Release --no-restore -warnaserror
      - name: unit + integration tests (Testcontainers) and the line-coverage gate
        run: scripts/coverage.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: coverage/coverage.cobertura.xml
          retention-days: 7
      - name: vulnerable packages
        run: |
          set -o pipefail
          dotnet list DisputePortal.slnx package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '^\s+>' vuln.txt; then echo "vulnerable package found" >&2; exit 1; fi

  stryker:
    # Mutation testing of the pure domain, report only (the score goes in the README). It never blocks: the job passes
    # whatever Stryker does (continue-on-error) and it is deliberately not in ci-ok's `needs`, so neither its failure
    # nor its absence can change the required check.
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - name: Stryker.NET on DisputePortal.Domain (backend/tests/DisputePortal.UnitTests/stryker-config.json)
        working-directory: backend/tests/DisputePortal.UnitTests
        run: |
          set -o pipefail
          dotnet tool run dotnet-stryker 2>&1 | tee stryker.log
      - name: mutation score in the job summary
        if: always()
        run: grep -h 'final mutation score' backend/tests/DisputePortal.UnitTests/stryker.log >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: stryker-report
          path: backend/tests/DisputePortal.UnitTests/StrykerOutput
          retention-days: 14

  frontend:
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - name: TS types match the committed OpenAPI snapshot
        run: |
          if [ -f ../docs/openapi.json ] && [ -f src/api/schema.d.ts ]; then
            npm run gen:types
            git diff --exit-code src/api/schema.d.ts
          fi
      - run: npm audit --audit-level=high

  images:
    # Both images are built and scanned whenever the stack is touched: the E2E needs both, and the layer cache keeps the
    # untouched one cheap. What gets published is decided separately, per half (see `publish`).
    needs: [changes]
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: api
          load: true
          tags: dispute-portal-api:local
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          load: true
          tags: dispute-portal-web:local
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Trivy (fixable CRITICAL blocks)
        run: |
          for img in dispute-portal-api:local dispute-portal-web:local; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore:ro" \
              ghcr.io/aquasecurity/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 image --severity CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore "$img"
          done
      - run: docker save dispute-portal-api:local dispute-portal-web:local -o images.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar
          retention-days: 1

  e2e:
    needs: [changes, images]
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: docker load -i images.tar
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: start the stack
        run: docker compose up -d --wait --no-build
      - name: a second `up` is idempotent (bootstrap re-runs against existing secrets, Vault and volumes)
        run: docker compose up -d --wait --no-build
      - run: npm ci --ignore-scripts
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npx playwright test
        working-directory: e2e
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 3

  publish:
    # One leg per half whose image content changed (the `halves` output of `changes`), so a backend change publishes
    # only the api image and a frontend change only the web image. Each leg pushes the exact image that was scanned
    # (Trivy) and exercised (E2E): no rebuild, so no drift. It needs `ci-ok`, which passes on skipped jobs. A manual
    # run is a dry run (it prints what it would push) unless dry_run is false, and it only pushes from main.
    # `!cancelled()` and the explicit results replace the implicit success(), which is false whenever ANY job upstream
    # was skipped (a half the change did not touch), and would silently skip every single-half publish.
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.images.result == 'success' && needs.ci-ok.result == 'success' && needs.changes.outputs.halves != '[]' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [changes, images, ci-ok]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        half: ${{ fromJSON(needs.changes.outputs.halves) }}
    env:
      HALF: ${{ matrix.half }}
      EVENT_NAME: ${{ github.event_name }}
      DO_PUSH: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main') }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
      - run: docker load -i images.tar
      - name: what this leg publishes
        run: echo "dispute-portal-${HALF}:${GITHUB_SHA} (push=${DO_PUSH}, event=${EVENT_NAME})"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: env.DO_PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: push the image (sha + latest)
        id: push
        if: env.DO_PUSH == 'true'
        run: |
          local_tag="dispute-portal-${HALF}:local"
          remote="ghcr.io/maseko-lucky-9/dispute-portal-${HALF}"
          docker tag "$local_tag" "${remote}:${GITHUB_SHA}"
          docker tag "$local_tag" "${remote}:latest"
          docker push "${remote}:${GITHUB_SHA}"
          docker push "${remote}:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${remote}:${GITHUB_SHA}" | cut -d@ -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "published ${remote}@${digest}" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.DO_PUSH == 'true'
        with:
          subject-name: ghcr.io/maseko-lucky-9/dispute-portal-${{ matrix.half }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: SBOM (CycloneDX)
        if: env.DO_PUSH == 'true'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" \
            ghcr.io/aquasecurity/trivy:0.65.0@sha256:a22415a38938a56c379387a8163fcb0ce38b10ace73e593475d3658d578b2436 \
            image --quiet --format cyclonedx --output "/out/sbom-${HALF}.cdx.json" "dispute-portal-${HALF}:local"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.DO_PUSH == 'true'
        with:
          name: sbom-${{ matrix.half }}
          path: sbom-${{ matrix.half }}.cdx.json
          retention-days: 30

  bump-homelab:
    # ADR-017: after a real publish, open (never merge) a pull request in homelab-infra that pins the new image digest
    # in apps/dispute-portal/kustomization.yaml; ArgoCD deploys it once a human merges. A separate job so the
    # cross-repo token never shares a job with packages:write and id-token:write. It runs only when `publish` pushed:
    # the same DO_PUSH rule as `publish` (a push to main, or a dispatch from main with dry_run false), inlined because a
    # job-level `if` cannot read `env`. A dry run skips this job entirely. The `if` is not the control, though: the
    # token lives in the `homelab-infra` environment, which only deployments from `main` can use. One failed publish leg
    # fails `publish` as a whole and so blocks both legs here. Not in ci-ok's `needs` (publish already needs ci-ok, and
    # it never gates a PR). The digest is re-read from the registry rather than taken from publish's outputs (matrix
    # legs share one output) and then bound to its provenance attestation before anything uses it.
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.changes.outputs.halves != '[]' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main')) }}
    needs: [changes, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: homelab-infra
    strategy:
      fail-fast: false
      matrix:
        half: ${{ fromJSON(needs.changes.outputs.halves) }}
    concurrency:
      group: bump-homelab-${{ matrix.half }}
      cancel-in-progress: false
    permissions:
      contents: read
      attestations: read
    env:
      HALF: ${{ matrix.half }}
      HOMELAB_REPO: maseko-lucky-9/homelab-infra
      HOMELAB_FILE: apps/dispute-portal/kustomization.yaml
    steps:
      - name: the homelab-infra token is configured
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_INFRA_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=HOMELAB_INFRA_TOKEN is not set::The secret HOMELAB_INFRA_TOKEN (environment homelab-infra; fine-grained, homelab-infra only, contents + pull requests write) is missing or not available to this run. The image was published, but no homelab bump PR was opened. See ADR-017." >&2
            exit 1
          fi
      - name: resolve the published digest from the registry
        id: digest
        run: |
          set -euo pipefail
          ref="ghcr.io/maseko-lucky-9/dispute-portal-${HALF}:${GITHUB_SHA}"
          re='^sha256:[0-9a-f]{64}$'
          digest=""
          for attempt in 1 2 3; do
            digest=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$ref" 2>/dev/null | tr -d '[:space:]' || true)
            if [[ $digest =~ $re ]]; then break; fi
            echo "attempt ${attempt}: no valid digest for ${ref} yet ('${digest}')"
            sleep 5
          done
          if ! [[ $digest =~ $re ]]; then
            echo "::error::could not resolve ${ref} to a sha256 digest (got '${digest}')" >&2
            exit 1
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "resolved ${ref} -> ${digest}"
      - name: the digest carries this commit's build provenance
        # The tag is mutable; the attestation is not. Pin only a digest that ci.yml itself attested, on refs/heads/main,
        # for exactly this commit (publish's attest-build-provenance step), from a GitHub-hosted runner.
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if gh attestation verify "oci://ghcr.io/maseko-lucky-9/dispute-portal-${HALF}@${DIGEST}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml" \
                --source-ref refs/heads/main \
                --source-digest "$GITHUB_SHA" \
                --deny-self-hosted-runners; then
              echo "provenance verified for dispute-portal-${HALF}@${DIGEST} (ci.yml, refs/heads/main, ${GITHUB_SHA})"
              exit 0
            fi
            echo "attempt ${attempt}: provenance not verified yet"
            sleep 10
          done
          echo "::error::no valid build provenance for dispute-portal-${HALF}@${DIGEST} from ci.yml on refs/heads/main at ${GITHUB_SHA}" >&2
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the PR step orders bump PRs by portal ancestry (a re-run of an old run must not win).
          fetch-depth: 0
          persist-credentials: false
      - name: clone homelab-infra
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_INFRA_TOKEN }}
        run: |
          set -euo pipefail
          # gh supplies the token through a credential helper: it is never in a URL, argv or the remote config.
          gh repo clone "$HOMELAB_REPO" "$RUNNER_TEMP/homelab-infra" -- --depth=1 --branch master
          gh auth setup-git --hostname github.com
      - name: open the bump pull request and close the ones it supersedes
        env:
          GH_TOKEN: ${{ secrets.HOMELAB_INFRA_TOKEN }}
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: scripts/open-homelab-bump-pr.sh

  ci-ok:
    if: always()
    # Not `stryker`: it is report-only (see its job). Skipped jobs pass (a half the change did not touch); a failed or
    # cancelled one fails the check, and so does a `changes` job that did not succeed, because a broken classifier
    # would otherwise read as a green PR full of skips.
    needs: [changes, secrets, backend, frontend, images, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: aggregate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "needs results: $RESULTS"
          if [ "$CHANGES" != success ]; then echo "changes: $CHANGES" >&2; exit 1; fi
          if echo "$RESULTS" | grep -qE 'failure|cancelled'; then exit 1; fi
