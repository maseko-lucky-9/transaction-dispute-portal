# Capitec-branded login: CSS only, no template overrides, so Keycloak upgrades can't break the markup.
parent=keycloak.v2
# `styles` replaces the parent's value, so restate the parent's stylesheet before ours.
# Two stale layers after a theme edit. Browsers: Keycloak serves theme files with max-age=30 days under a path that does
# not change, so bump `?v=` here and on the logo URL in dispute-portal.css. Server: Keycloak keeps a gzip copy of each
# file under data/tmp/kc-gzip-cache keyed by path alone (not mtime or query), and every browser asks for gzip, so a
# running container keeps serving the old CSS. Locally: docker compose exec keycloak rm -rf /opt/keycloak/data/tmp/kc-gzip-cache
# (a rolled pod starts empty, so the cluster needs nothing).
styles=css/styles.css css/dispute-portal.css?v=2
