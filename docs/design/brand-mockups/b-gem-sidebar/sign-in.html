<!doctype html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · B Gem Sidebar</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="../shared/base.css">
<link rel="stylesheet" href="dir.css">
<script src="../shared/switcher.js" defer></script>
</head>
<body>
<!-- Keycloak keycloak.v2 login page, restyled with CSS only: same fields, ids and order. -->
<div class="kc-page">
  <span class="logo-tile kc-logo"><img src="../shared/capitec-bank-logo.jpg" alt="Capitec"></span>
  <main class="kc-card">
    <h1>Sign in to your account</h1>
    <form class="field kc-form" action="home.html">
      <div class="field"><label for="username">Username</label><input class="input" id="username" name="username" autocomplete="username" value="thandi"></div>
      <div class="field"><label for="password">Password</label>
        <div class="kc-pass"><input class="input" id="password" name="password" type="password" autocomplete="current-password"><button class="btn btn-ghost btn-sm eye" type="button" aria-label="Show password"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
      </div>
      <button class="btn btn-primary" id="kc-login" type="submit">Sign In</button>
    </form>
  </main>
  <p class="kc-note">Keycloak's login page with the Capitec logo, a Blue Gem backdrop and brand colours. Field names and ids stay the same.</p>
</div>
</body>
</html>
